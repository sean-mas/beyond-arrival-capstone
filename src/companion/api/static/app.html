<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E5E4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Relocation Provider · companion</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&f[]=zodiak@400,500,700&display=swap">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/intro/intro.css">
</head>
<body>
<div class="app" id="app">
  <header class="top" id="top" hidden>
    <div class="brand"><div class="mark" id="mark">R</div>
      <div><div class="name" id="brand-name">Relocation Provider</div><div class="sub" id="brand-sub">Your companion after the move</div></div></div>
    <nav class="sidenav" id="sidenav"></nav>
    <button class="who-btn" id="who-btn" aria-label="Switch person"></button>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs" hidden></nav>
</div>
<div class="sheet-backdrop" id="backdrop" hidden></div>
<section class="sheet" id="sheet" hidden aria-modal="true" role="dialog"></section>
<!-- The page still calls /api/chat for every turn; see app.js. -->
<script type="module" src="/static/app.js"></script>
</body>
</html>
