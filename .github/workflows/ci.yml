# The actual gate. Runs on every push and PR. Calls no models, so it is free.
name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"        # pinned: green locally must mean green here
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eval]"   # eval: scikit-learn for the lexical retriever the tests use

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Types
        run: mypy

      - name: Tests
        run: pytest -q --cov=companion --cov-report=term-missing

      # A card missing `sources` is a card whose claims cannot be traced, and
      # groundedness measured against it means nothing.
      - name: Corpus
        run: python3 content/validate_cards.py

      # Reads the stored results file written by evals.yml. No API calls here,
      # so the gate stays free and fast while still blocking a regression.
      - name: Eval gate
        run: pytest -q tests/test_eval_gate.py

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t companion:${{ github.sha }} .
      - name: Container starts and answers /healthz
        run: |
          docker run -d --name companion -p 8000:8000 -e DATABASE_URL=sqlite:///./test.db companion:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/healthz && break || sleep 2
          done
          docker logs companion
